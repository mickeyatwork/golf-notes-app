<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
    <filter id="shadow-club" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#052e16" flood-opacity="0.35" />
    </filter>

    <!-- Clip Gradients -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Shaft Chrome Gradient -->
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Club Head Metal Gradient -->
    <linearGradient id="ironHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Ball 3D Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
  </defs>

  <!-- === 1. CLIPBOARD / NOTEPAD === -->
  <g filter="url(#shadow-main)">
    <!-- Clipboard Wooden/Green Base -->
    <rect x="18" y="16" width="76" height="96" rx="14" fill="url(#boardGrad)" stroke="#166534" stroke-width="2" />

    <!-- Notepad Paper -->
    <rect x="24" y="24" width="64" height="82" rx="9" fill="#ffffff" />

    <!-- Notepad Header Banner -->
    <path d="M24 33 C24 28 28 24 33 24 L79 24 C84 24 88 28 88 33 L88 38 L24 38 Z" fill="#dcfce7" />
    <!-- Scorecard Columns / Grid Header Indicator -->
    <circle cx="33" cy="31" r="2.5" fill="#16a34a" />
    <rect x="40" y="29.5" width="22" height="3" rx="1.5" fill="#86efac" />
    <rect x="67" y="29.5" width="14" height="3" rx="1.5" fill="#bbf7d0" />

    <!-- Scorecard Ruled Lines -->
    <!-- Line 1 -->
    <line x1="32" y1="48" x2="78" y2="48" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Golf Hole Flag Icon on Line 1 -->
    <line x1="34" y1="43" x2="34" y2="51" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M34 43 L40 45.5 L34 48 Z" fill="#ef4444" />
    <rect x="44" y="46.5" width="26" height="3" rx="1.5" fill="#e2e8f0" />

    <!-- Line 2 -->
    <line x1="32" y1="60" x2="72" y2="60" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <rect x="34" y="58.5" width="16" height="3" rx="1.5" fill="#e2e8f0" />
    <circle cx="56" cy="60" r="3" stroke="#22c55e" stroke-width="1.5" fill="none" />
    <rect x="63" y="58.5" width="12" height="3" rx="1.5" fill="#e2e8f0" />

    <!-- Line 3 -->
    <line x1="32" y1="72" x2="66" y2="72" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <rect x="34" y="70.5" width="24" height="3" rx="1.5" fill="#e2e8f0" />

    <!-- Line 4 (Score note / written checkmark in rich green) -->
    <path d="M35 86 Q46 84 56 89" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M56 89 L62 82 L70 91" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Clipboard Metal Clip -->
    <rect x="42" y="10" width="28" height="15" rx="5" fill="url(#clipGrad)" stroke="#d97706" stroke-width="1.5" />
    <circle cx="56" cy="16.5" r="3.2" fill="#78350f" />
    <!-- Clip Inner Spring Accent -->
    <rect x="47" y="19.5" width="18" height="3" rx="1.5" fill="#fef3c7" opacity="0.8" />
  </g>

  <!-- === 2. GOLF CLUB WRITING ON THE PAD === -->
  <g filter="url(#shadow-club)">
    <!-- Club Grip (Black rubber with wrap cues) -->
    <line x1="117" y1="9" x2="101" y2="25" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
    <line x1="117" y1="9" x2="114" y2="12" stroke="#0f172a" stroke-width="9.5" stroke-linecap="round" />
    <!-- White grip highlight bands -->
    <line x1="111" y1="13" x2="114" y2="16" stroke="#475569" stroke-width="1.5" />
    <line x1="106" y1="18" x2="109" y2="21" stroke="#475569" stroke-width="1.5" />

    <!-- Club Steel Shaft -->
    <line x1="101" y1="25" x2="71" y2="55" stroke="url(#shaftGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Shaft metallic gleam -->
    <line x1="100" y1="24" x2="72" y2="52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

    <!-- Hosel (Ferrule / Joint) -->
    <line x1="72" y1="54" x2="67" y2="59" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <line x1="68" y1="58" x2="65" y2="61" stroke="#cbd5e1" stroke-width="5.5" />

    <!-- Iron Club Head -->
    <!-- Stylized forged iron head angled downwards into a pen tip -->
    <path d="M66 59 
             C69 63, 75 70, 77 75 
             C78 78, 76 81, 72 81 
             C68 81, 62 82, 57 85 
             C55 86.5, 53 88, 51 90 
             C50 87, 51 82, 53 77 
             C55 72, 59 65, 63 60 
             Z" 
          fill="url(#ironHeadGrad)" 
          stroke="#475569" 
          stroke-width="1.5" 
          stroke-linejoin="round" />

    <!-- Club Face Grooves -->
    <line x1="61" y1="73" x2="70" y2="76" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
    <line x1="59" y1="77" x2="68" y2="80" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
    <line x1="56" y1="81" x2="63" y2="83" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Toe / Pen Nib Tip Writing on the Paper -->
    <path d="M51 90 L50 93 L54 90.5 Z" fill="#15803d" />
  </g>

  <!-- === 3. FRESH INK STROKE & INSPIRATION SPARKLE === -->
  <!-- Dynamic Green Ink connecting from club nib -->
  <path d="M50 93 C47 95, 43 96, 40 95 C37 94, 38 91, 41 90 C45 89, 49 91, 52 92" 
        stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- Writing Sparkle / Star at contact point -->
  <path d="M48 83 Q50 86 53 87 Q50 88 48 91 Q46 88 43 87 Q46 86 48 83 Z" fill="#facc15" />
  <circle cx="58" cy="88" r="1.5" fill="#4ade80" />

  <!-- === 4. MINI GOLF BALL IN CORNER === -->
  <g filter="url(#shadow-main)">
    <circle cx="98" cy="100" r="15" fill="url(#ballGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Subtle Golf Ball Dimples -->
    <circle cx="93" cy="95" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="98" cy="93" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="103" cy="95" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="90" cy="100" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="95" cy="99" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="100" cy="99" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="105" cy="101" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="94" cy="105" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="99" cy="105" r="1.4" fill="#94a3b8" opacity="0.4" />
    <circle cx="104" cy="106" r="1.4" fill="#94a3b8" opacity="0.4" />
  </g>
</svg>